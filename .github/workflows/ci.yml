name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          # Without this, setup-go serves the runner's cached patch release,
          # which lags real releases — CI once built with 1.25.12 while
          # 1.25.13 was out, so vulncheck flagged five stdlib advisories that
          # were already fixed upstream. check-latest cannot help once the
          # line itself is out of support: Go fixes only the two newest minor
          # lines, so move this when a new Go minor ships (1.25 was left behind
          # by 1.27, and vulncheck went red on every PR).
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Print coverage
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

      - name: Check coverage threshold
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | tr -d '%')
          threshold=55
          if [ "$(echo "$total < $threshold" | bc)" -eq 1 ]; then
            echo "Coverage ${total}% is below threshold ${threshold}%"
            exit 1
          fi
          echo "Coverage ${total}% meets threshold ${threshold}%"

      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false

      - name: Check go.sum drift
        run: |
          go mod tidy
          git diff --exit-code go.sum

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          # Without this, setup-go serves the runner's cached patch release,
          # which lags real releases — CI once built with 1.25.12 while
          # 1.25.13 was out, so vulncheck flagged five stdlib advisories that
          # were already fixed upstream. check-latest cannot help once the
          # line itself is out of support: Go fixes only the two newest minor
          # lines, so move this when a new Go minor ships (1.25 was left behind
          # by 1.27, and vulncheck went red on every PR).
          check-latest: true

      - name: Test
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          # Without this, setup-go serves the runner's cached patch release,
          # which lags real releases — CI once built with 1.25.12 while
          # 1.25.13 was out, so vulncheck flagged five stdlib advisories that
          # were already fixed upstream. check-latest cannot help once the
          # line itself is out of support: Go fixes only the two newest minor
          # lines, so move this when a new Go minor ships (1.25 was left behind
          # by 1.27, and vulncheck went red on every PR).
          check-latest: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: "v2.11"

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          # Without this, setup-go serves the runner's cached patch release,
          # which lags real releases — CI once built with 1.25.12 while
          # 1.25.13 was out, so vulncheck flagged five stdlib advisories that
          # were already fixed upstream. check-latest cannot help once the
          # line itself is out of support: Go fixes only the two newest minor
          # lines, so move this when a new Go minor ships (1.25 was left behind
          # by 1.27, and vulncheck went red on every PR).
          check-latest: true

      - name: Install govulncheck
        # Pinned, not @latest: a new x/vuln can require a newer Go than the
        # line above (v1.8.0 needed 1.26 while CI was on 1.25), and with
        # GOTOOLCHAIN=local the install then fails before any scan runs.
        # Bump this alongside the Go line above.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Run govulncheck
        run: govulncheck ./...
