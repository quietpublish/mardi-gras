name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          # Release binaries are compiled with whatever toolchain this step
          # installs, and .goreleaser.yaml pins no Go version of its own.
          # Without check-latest, setup-go serves the runner image's cached
          # patch release, so a release can ship a stdlib that govulncheck
          # already flags — CI hit exactly that with 1.25.12 vs 1.25.13.
          check-latest: true

      # The tap lives under matt-wright86, so GITHUB_TOKEN cannot push to it.
      # Mint a short-lived installation token from the mardi-gras-tap-bot
      # GitHub App instead of holding a PAT: the previous PAT expired after
      # 90 days and v0.32.1 (2026-09-13) ended half-done, release published,
      # cask push 401. App keys do not expire. The token is scoped to the
      # tap repo only and dies with the run.
      - name: Mint Homebrew tap token
        id: tap-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: matt-wright86
          repositories: homebrew-tap

      # Fail here, before anything is published, if the minted token cannot
      # push to the tap (app uninstalled, permission changed). goreleaser
      # pushes the cask after the GitHub Release and assets already exist,
      # so this is the backstop; tap-token-check.yml is the weekly early
      # warning.
      - name: Check Homebrew tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: |
          set -euo pipefail
          resp=$(curl -sS -w '\n%{http_code}' \
            -H "Authorization: Bearer ${HOMEBREW_TAP_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/matt-wright86/homebrew-tap)
          code=${resp##*$'\n'}
          body=${resp%$'\n'*}
          if [ "$code" != "200" ]; then
            echo "::error::tap token rejected by GitHub (HTTP $code)"; exit 1
          fi
          if ! printf '%s' "$body" | jq -e '.permissions.push == true' >/dev/null; then
            echo "::error::tap token has no push access to matt-wright86/homebrew-tap"; exit 1
          fi
          echo "tap token OK"

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
