name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          # Release binaries are compiled with whatever toolchain this step
          # installs, and .goreleaser.yaml pins no Go version of its own.
          # Without check-latest, setup-go serves the runner image's cached
          # patch release, so a release can ship a stdlib that govulncheck
          # already flags — CI hit exactly that with 1.25.12 vs 1.25.13.
          check-latest: true

      # Fail here, before anything is published, if the tap token is dead.
      # goreleaser pushes the Homebrew cask *after* creating the GitHub
      # Release and uploading assets, so a bad token otherwise leaves a
      # half-done release (v0.32.1 on 2026-09-13: release published, cask
      # push 401, run red). The token is a PAT and expires; the scheduled
      # tap-token-check workflow is the early warning, this is the backstop.
      - name: Check Homebrew tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN secret is not set"; exit 1
          fi
          resp=$(curl -sS -w '\n%{http_code}' \
            -H "Authorization: Bearer ${HOMEBREW_TAP_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/matt-wright86/homebrew-tap)
          code=${resp##*$'\n'}
          body=${resp%$'\n'*}
          if [ "$code" != "200" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN rejected by GitHub (HTTP $code). Rotate the secret before releasing."; exit 1
          fi
          if ! printf '%s' "$body" | jq -e '.permissions.push == true' >/dev/null; then
            echo "::error::HOMEBREW_TAP_TOKEN has no push access to matt-wright86/homebrew-tap"; exit 1
          fi
          echo "tap token OK"

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
