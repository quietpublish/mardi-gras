name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          # Release binaries are compiled with whatever toolchain this step
          # installs, and .goreleaser.yaml pins no Go version of its own.
          # Without check-latest, setup-go serves the runner image's cached
          # patch release, so a release can ship a stdlib that govulncheck
          # already flags — CI hit exactly that with 1.25.12 vs 1.25.13.
          check-latest: true

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
