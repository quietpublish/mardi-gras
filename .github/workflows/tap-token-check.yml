name: Tap token check

# Early warning that HOMEBREW_TAP_TOKEN has expired. The token is a PAT with
# a finite lifetime; release.yml only discovers a dead token on release day.
# A failing run here emails the repo owner. Run it by hand after rotating
# the secret to confirm the new value works.

on:
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Homebrew tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN secret is not set"; exit 1
          fi
          resp=$(curl -sS -w '\n%{http_code}' \
            -H "Authorization: Bearer ${HOMEBREW_TAP_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/matt-wright86/homebrew-tap)
          code=${resp##*$'\n'}
          body=${resp%$'\n'*}
          if [ "$code" != "200" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN rejected by GitHub (HTTP $code). Rotate the secret."; exit 1
          fi
          if ! printf '%s' "$body" | jq -e '.permissions.push == true' >/dev/null; then
            echo "::error::HOMEBREW_TAP_TOKEN has no push access to matt-wright86/homebrew-tap"; exit 1
          fi
          echo "tap token OK"
