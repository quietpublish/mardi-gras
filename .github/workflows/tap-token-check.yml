name: Tap token check

# Early warning that the release workflow can no longer push the Homebrew
# cask: the mardi-gras-tap-bot GitHub App was uninstalled from the tap, its
# key was revoked, or the secrets were removed. release.yml only discovers
# that on release day. A failing run here emails the repo owner. Run it by
# hand after any change to the app or its secrets.

on:
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read # checkout, for the local composite action

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions/tap-token

      - name: Mint and verify Homebrew tap token
        uses: ./.github/actions/tap-token
        with:
          app-id: ${{ secrets.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
